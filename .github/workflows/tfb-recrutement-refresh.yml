name: Rafraichir les donnees recrutement

# ============================================================================
# CE FICHIER EST DEVENU UN WORKFLOW REUTILISABLE (workflow_call).
# Il ne porte PLUS de `schedule:` -- voir POURQUOI ci-dessous.
#
# DIAGNOSTIC (02/09/2026) : les 3 crons declares ici ne produisaient QU'UN SEUL
# run par jour depuis le 06/08. GitHub ne declenche pas un nouveau run planifie
# tant que le run planifie precedent du MEME workflow est encore en attente.
# Comme le cron de 02:17 partait avec 5 a 11 h de retard, il restait "pending"
# a 04:17 et 05:43 : les deux filets etaient donc avales, jamais executes.
# La redondance etait fictive -- une seule derive suffisait a casser la chaine.
#
# CORRECTIF : la suppression des runs en attente est PAR WORKFLOW. On sort donc
# les crons dans 3 petits fichiers appelants distincts (recrutement-cron-1/2/3),
# chacun avec UN seul cron. Un filet en retard ne bloque plus les autres :
# la redondance devient reelle.
#
# Le `concurrency` ci-dessous empeche toujours deux extractions de se chevaucher,
# et le `git commit || echo rien a committer` rend les runs redondants inoffensifs.
# ============================================================================

on:
  workflow_call:        # appele par recrutement-cron-1.yml / -2 / -3
  workflow_dispatch:    # lancement manuel ("Run workflow")
  repository_dispatch:  # declenchement externe fiable (cron-job.org, Netlify, autre repo)
    types: [refresh-recrutement]

permissions:
  contents: write

concurrency:
  group: recrutement-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # Court-circuit : si data.js a deja ete rafraichi aujourd'hui, on s'arrete.
      # Evite qu'un filet en retard refasse une extraction Teamtailor inutile.
      - name: Data deja fraiche aujourd'hui ?
        id: fresh
        run: |
          if [ -f data.js ]; then
            gen=$(grep -o '"generatedAt"[[:space:]]*:[[:space:]]*"[^"]*"' data.js | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
            echo "generatedAt actuel = $gen"
            if [ "${gen:0:10}" = "$(date -u +%F)" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "Deja rafraichi aujourd'hui -- rien a faire."
            fi
          fi

      # Retry : une extraction peut echouer sur un hoquet reseau / rate-limit.
      - name: Extraction Teamtailor -> data.js (avec retry)
        if: steps.fresh.outputs.skip != 'true'
        env:
          TEAMTAILOR_API_KEY: ${{ secrets.TEAMTAILOR_API_KEY }}
          TEAMTAILOR_STACK: ${{ secrets.TEAMTAILOR_STACK }}
          TEAMTAILOR_API_VERSION: ${{ secrets.TEAMTAILOR_API_VERSION }}
        run: |
          cp build-data.txt build-data.mjs
          n=0
          until [ $n -ge 3 ]; do
            if node build-data.mjs; then echo Extraction OK; break; fi
            n=$((n+1)); echo Retry extraction $n/3 dans 60s; sleep 60
          done
          if [ $n -ge 3 ]; then echo '::error::Extraction Teamtailor en echec apres 3 tentatives'; exit 1; fi

      # Garde-fou : ne pas committer un data.js vide ou tronque.
      - name: Verifier data.js
        if: steps.fresh.outputs.skip != 'true'
        run: |
          test -f data.js || { echo '::error::data.js absent'; exit 1; }
          bytes=$(wc -c < data.js); echo data.js = $bytes octets
          [ $bytes -ge 1000000 ] || { echo '::error::data.js trop petit'; exit 1; }

      # Garde-fou supplementaire : le generatedAt doit bien etre celui d'aujourd'hui.
      # Sans ca, un data.js valide mais perime pouvait etre committe sans alerte.
      - name: Verifier la fraicheur du generatedAt
        if: steps.fresh.outputs.skip != 'true'
        run: |
          gen=$(grep -o '"generatedAt"[[:space:]]*:[[:space:]]*"[^"]*"' data.js | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          echo "generatedAt = $gen"
          [ "${gen:0:10}" = "$(date -u +%F)" ] || { echo "::error::generatedAt ($gen) n est pas aujourd hui"; exit 1; }

      # Non bloquant : ne doit pas empecher le commit du data.js.
      - name: Journal des evenements d etape
        if: steps.fresh.outputs.skip != 'true'
        run: node snapshot-events.mjs || echo '::warning::snapshot-events a echoue'

      - name: Evaluations Teamtailor -> evaluations.json
        if: steps.fresh.outputs.skip != 'true'
        env:
          TEAMTAILOR_API_KEY: ${{ secrets.TEAMTAILOR_API_KEY }}
          TEAMTAILOR_STACK: ${{ secrets.TEAMTAILOR_STACK }}
          TEAMTAILOR_API_VERSION: ${{ secrets.TEAMTAILOR_API_VERSION }}
        run: node fetch-evaluations.mjs || echo '::warning::fetch-evaluations a echoue'

      - name: Commit data.js + journal + evaluations
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name tfb-bot
          git config user.email bot@thefrenchbastards.fr
          git add data.js stage-snapshot.json stage-events.json evaluations.json
          git commit -m 'chore: refresh Teamtailor data' || echo rien a committer
          git pull --rebase origin main || true
          git push
