name: Probe évaluations Teamtailor (temporaire)

# Lance à la main (Run workflow) pour explorer le schéma des scorecards Teamtailor.
# Lecture seule, ne commit rien. À supprimer une fois le schéma connu.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Probe évaluations
        env:
          TEAMTAILOR_API_KEY: ${{ secrets.TEAMTAILOR_API_KEY }}
          TEAMTAILOR_STACK: ${{ secrets.TEAMTAILOR_STACK }}
          TEAMTAILOR_API_VERSION: ${{ secrets.TEAMTAILOR_API_VERSION }}
        run: node probe-evaluations.mjs
